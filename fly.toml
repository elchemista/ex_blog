# fly.toml app configuration file generated for spectre-blog on 2026-08-04T16:24:30+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'spectre-blog'
primary_region = 'fra'

[build]
  dockerfile = 'Dockerfile'

  [build.args]
    LIGHTPANDA_IMAGE = 'docker.io/lightpanda/browser:nightly@sha256:0acfc0f9be11f97b9846c8168cff209b892a49bf2ae55c4ac20bde75dfd58afd'
    TDLIB_BUILD_JOBS = '2'
    TDLIB_IMAGE = 'registry.fly.io/freelance:tdlib-bookworm-b876ee4dcfba@sha256:1f99be7652facf5e6c4492644f7b734f50c255837a25115df657cd4169721393'

[env]
  EX_BLOG_DATA_DIR = '/data'
  EX_BLOG_DEFAULT_LANGUAGE = 'it'
  EX_BLOG_CORS_ORIGINS = 'https://spectre-blog.fly.dev,https://spectre.elchemista.com'
  EX_BLOG_EMBEDDING_DIMENSIONS = '1024'
  EX_BLOG_EMBEDDING_MODEL = 'openrouter:perplexity/pplx-embed-v1-0.6b'
  EX_BLOG_GITHUB_BRANCH = 'master'
  EX_BLOG_MAX_ARTICLE_COST_EUR = '2'
  EX_BLOG_MONTHLY_BUDGET_EUR = '20'
  EX_BLOG_SUPPORTED_LANGUAGES = 'it,en'
  PHX_CHECK_ORIGINS = 'https://spectre-blog.fly.dev,https://spectre.elchemista.com'
  PHX_HOST = 'spectre.elchemista.com'
  PHX_SERVER = 'true'
  PORT = '4000'

[[mounts]]
  source = 'ex_blog_data'
  destination = '/data'
  initial_size = '1GB'
  snapshot_retention = 7

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 150
    soft_limit = 100

  [[http_service.checks]]
    grace_period = '20s'
    interval = '1m'
    method = 'GET'
    path = '/health'
    protocol = 'http'
    timeout = '5s'

    [http_service.checks.headers]
      X-Forwarded-Proto = 'https'

[[vm]]
  memory = '1gb'
  cpus = 2
  memory_mb = 1024
